[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.8
allow = ["MIT", "MIT-0", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
