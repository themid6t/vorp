name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.changes.outputs.run_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for non-Markdown changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            run_ci=true
          else
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            fi
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/vorp-changed-files"
            if grep -qEv '\.md$' "$RUNNER_TEMP/vorp-changed-files"; then
              run_ci=true
            else
              run_ci=false
              echo 'Markdown-only change: skipping the Rust gates and release builds.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: steps.changes.outputs.run_ci == 'true'
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run_ci == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/web/ui/package-lock.json
      # The dashboard is embedded into the binary, so it is built before any cargo step.
      - if: steps.changes.outputs.run_ci == 'true'
        working-directory: crates/web/ui
        run: npm ci && npm run check && npm run build
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: steps.changes.outputs.run_ci == 'true'
        with:
          command: check
      - if: steps.changes.outputs.run_ci == 'true'
        run: cargo fmt --all --check
      - if: steps.changes.outputs.run_ci == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - if: steps.changes.outputs.run_ci == 'true'
        run: cargo test --all-features

  # Release binaries for every code push to main. A release tag publishes
  # these artifacts for its commit instead of rebuilding.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.rust.outputs.run_ci == 'true'
    needs: rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/web/ui/package-lock.json
      - working-directory: crates/web/ui
        run: npm ci && npm run build
      - run: test -f crates/web/ui/dist/index.html
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vorp-linux-${{ matrix.arch }}-${{ github.sha }}
          path: target/${{ matrix.target }}/release/vorp
          if-no-files-found: error
          retention-days: 30

  # macOS: tests on every code change, so the platform cannot silently break,
  # and release binaries for both architectures on main.
  macos:
    if: needs.rust.outputs.run_ci == 'true'
    needs: rust
    runs-on: macos-14
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/web/ui/package-lock.json
      - working-directory: crates/web/ui
        run: npm ci && npm run build
      - run: cargo test --all-features
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
          done
          # The runner is Apple Silicon; the Intel build is checked by its
          # architecture only.
          target/aarch64-apple-darwin/release/vorp --version
          file target/x86_64-apple-darwin/release/vorp | grep -q x86_64
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vorp-darwin-arm64-${{ github.sha }}
          path: target/aarch64-apple-darwin/release/vorp
          if-no-files-found: error
          retention-days: 30
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vorp-darwin-amd64-${{ github.sha }}
          path: target/x86_64-apple-darwin/release/vorp
          if-no-files-found: error
          retention-days: 30

  # Windows: the agent's platform. Tests on every code change; an amd64
  # release binary on main.
  windows:
    if: needs.rust.outputs.run_ci == 'true'
    needs: rust
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_STRIP: symbols
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/web/ui/package-lock.json
      - working-directory: crates/web/ui
        run: npm ci && npm run build
      - run: cargo test --all-features
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cargo build --release --locked
          target/release/vorp.exe --version
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vorp-windows-amd64-${{ github.sha }}
          path: target/release/vorp.exe
          if-no-files-found: error
          retention-days: 30
