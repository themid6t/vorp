name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.changes.outputs.run_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for non-Markdown changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            run_ci=true
          else
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            fi
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/vorp-changed-files"
            if grep -qEv '\.md$' "$RUNNER_TEMP/vorp-changed-files"; then
              run_ci=true
            else
              run_ci=false
              echo 'Markdown-only change: skipping Rust gates and staging deployment.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: steps.changes.outputs.run_ci == 'true'
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run_ci == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/web/ui/package-lock.json
      # The dashboard is embedded into the binary, so it is built before any cargo step.
      - if: steps.changes.outputs.run_ci == 'true'
        working-directory: crates/web/ui
        run: npm ci && npm run check && npm run build
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: steps.changes.outputs.run_ci == 'true'
        with:
          command: check
      - if: steps.changes.outputs.run_ci == 'true'
        run: cargo fmt --all --check
      - if: steps.changes.outputs.run_ci == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - if: steps.changes.outputs.run_ci == 'true'
        run: cargo test --all-features

  # Built beside staging so a release tag can publish this commit's binaries
  # without rebuilding. Staging itself runs amd64 only.
  build-arm64:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.rust.outputs.run_ci == 'true'
    needs: rust
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: aarch64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/web/ui/package-lock.json
      - working-directory: crates/web/ui
        run: npm ci && npm run build
      - run: test -f crates/web/ui/dist/index.html
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: vorp-linux-arm64-${{ github.sha }}
          path: target/aarch64-unknown-linux-musl/release/vorp
          if-no-files-found: error
          retention-days: 30

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.rust.outputs.run_ci == 'true'
    needs: rust
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/web/ui/package-lock.json
      - working-directory: crates/web/ui
        run: npm ci && npm run build
      - run: test -f crates/web/ui/dist/index.html
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: vorp-linux-amd64-${{ github.sha }}
          path: target/x86_64-unknown-linux-musl/release/vorp
          if-no-files-found: error
          retention-days: 30
      - name: Deploy to staging
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          binary=target/x86_64-unknown-linux-musl/release/vorp
          checksum=$(sha256sum "$binary" | cut -d ' ' -f 1)
          scp -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "$binary" "vorp-deploy@$STAGING_SSH_HOST:incoming/vorp"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "vorp-deploy@$STAGING_SSH_HOST" \
            sudo -n /usr/local/sbin/vorp-deploy-staging "$GITHUB_SHA" "$checksum"
