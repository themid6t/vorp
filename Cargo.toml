[package]
name = "vorp"
version = "0.0.3"
edition = "2024"
license = "MIT"
publish = false

[workspace]
members = [
    "crates/protocol",
    "crates/store",
    "crates/relay",
    "crates/agent",
    "crates/web",
]
default-members = [
    ".",
    "crates/protocol",
    "crates/store",
    "crates/relay",
    "crates/agent",
    "crates/web",
]
resolver = "3"

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vorp-agent = { path = "crates/agent" }
vorp-relay = { path = "crates/relay" }
vorp-store = { path = "crates/store" }
vorp-web = { path = "crates/web" }
