[package]
name = "vorp-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum.workspace = true
thiserror.workspace = true
vorp-store = { path = "../store" }
serde = { workspace = true, features = ["derive"] }
argon2 = "0.5"
getrandom = "0.3"
tokio = { workspace = true, features = ["sync"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["mime-guess"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
